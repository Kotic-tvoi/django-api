name: Django checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      PRICE_HISTORY_VIEW_ENABLED: "false"
      HUCSTER_CHANGE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django system check
        run: python myproject/manage.py check

      - name: Run regression tests
        run: python myproject/manage.py test myproject
