# Add inside the ACTIVE HTTPS server { } block, after testing locally.
# Restrict access using BOTH HTTP Basic Auth and the VNC password.
# Generate credentials separately; never commit .htpasswd.
location = /wb-browser {
    return 302 /wb-browser/vnc.html;
}
location /wb-browser/ {
    auth_basic "WB browser operator";
    auth_basic_user_file /etc/nginx/wb-browser.htpasswd;

    proxy_pass http://127.0.0.1:6081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
