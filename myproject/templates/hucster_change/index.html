{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Huckster • Проверка товаров</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg:#0b1220; --card:#121a2b; --border:#1f2a44;
      --text:#e8eefc; --muted:#9bb0d3; --accent:#3656d8;
    }
    body { background:var(--bg); color:var(--text); }
    .panel { max-width:900px; margin:0 auto; padding:36px 20px; }
    .card-dark { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; }
    .form-control { background:#0d162c; color:#fff; border:1px solid var(--border); }
    .form-control:focus { background:#0d162c; color:#fff; }
    .btn-market { background:var(--accent); color:#fff; border:0; min-height:48px; font-weight:600; }
    .btn-market:hover { background:#4969eb; color:#fff; }
    .output { background:#0d162c; border-radius:12px; padding:16px; white-space:pre-wrap;
              overflow:auto; max-height:420px; color:#cde3ff; font:13px/1.5 monospace; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <main class="panel">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 mb-1">Huckster</h1>
        <div class="muted">Ручная отправка товаров на проверку</div>
      </div>
      <a href="/" class="btn btn-outline-light btn-sm">На главную</a>
    </div>

    <section class="card-dark mb-4">
      <label for="keys" class="form-label fw-semibold">Артикулы или Huckster ID</label>
      <textarea id="keys" class="form-control mb-2" rows="6"
        placeholder="маска_7Seconds&#10;ColdBTX150&#10;или 32-символьный ID"></textarea>
      <div class="muted small mb-3">
        Вставьте uid из каталога или 32-символьные ID. Каждый товар — с новой строки.
      </div>
      <div class="row g-2">
        <div class="col-md-6">
          <button class="btn btn-market w-100" onclick="sendSelected('wb')">
            Скорректировать цены WB
          </button>
        </div>
        <div class="col-md-6">
          <button class="btn btn-market w-100" onclick="sendSelected('ozon')">
            Скорректировать цены OZON
          </button>
        </div>
      </div>
      {% csrf_token %}
    </section>

    <section class="card-dark">
      <div class="fw-semibold mb-3">Результат проверки</div>
      <div id="result" class="output">Ожидание запуска...</div>
    </section>
  </main>

  <script>
    async function sendSelected(mp) {
      const text = document.getElementById('keys').value.trim();
      const output = document.getElementById('result');

      if (!text) {
        output.textContent = 'Сначала вставьте артикулы или Huckster ID.';
        return;
      }

      output.textContent = 'Отправляем товары на проверку...';

      const body = new FormData();
      body.append('mp', mp);
      body.append('keys', text);

      const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

      try {
        const response = await fetch('/hucster/run-selected/', {
          method: 'POST',
          headers: { 'X-CSRFToken': csrf },
          body
        });

        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);

        if (!response.ok) {
          output.textContent = 'Ошибка HTTP ' + response.status + '\n' +
            JSON.stringify(data, null, 2);
        }
      } catch (error) {
        output.textContent = 'Ошибка запроса: ' + error.message;
      }
    }
  </script>
</body>
</html>
